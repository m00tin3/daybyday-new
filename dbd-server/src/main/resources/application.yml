# ============================================================
# Day-BY-Day 后端配置
# 数据库/Redis 连接支持环境变量覆盖：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
# 本地默认 localhost；Docker 部署由 docker-compose 注入容器名
#
# 生产开关（由 .env 注入，无需改动代码）：
#   SQL_LOG_IMPL / LOG_LEVEL / SMS_MOCK
# ============================================================

server:
  # 后端端口：nginx 反代 /api → backend:8080（容器内）
  port: 8080

spring:
  application:
    name: dbd-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库 dbd（建库脚本见 src/main/resources/db/init.sql）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/dbd?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
  data:
    redis:
      # Redis（会话/缓存/计数/秒杀/GEO/Feed 均由 Redis 承载）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 生产启用密码（.env 注入）；本地开发默认空 = 不鉴权
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

mybatis-plus:
  # Mapper XML 位置（PostMapper.xml 等）
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线字段名自动映射驼峰属性（user_id -> userId）
    map-underscore-to-camel-case: true
    # SQL 打印：开发期 StdOutImpl 便于调试；生产由 .env 切为 NoLoggingImpl
    log-impl: ${SQL_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      # 主键由 Redis 全局 ID 生成器产生，禁用 MyBatis-Plus 默认雪花算法
      id-type: none

springdoc:
  swagger-ui:
    # Swagger UI 入口
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # 只扫描 /api 下接口
  paths-to-match: /api/**

logging:
  level:
    # 生产由 .env 设为 info，避免 debug 日志刷满磁盘
    com.dbd: ${LOG_LEVEL:debug}

# ============ 应用自定义配置 ============
app:
  sms:
    # 演示模式：验证码固定 123456，不接真实短信通道（联调/面试演示直接输入）
    # 生产模式改为 false，并在 AuthServiceImpl 中接入短信服务商 API
    mock: ${SMS_MOCK:true}
