# ============================================================
# Day-BY-Day 前端 nginx 配置（Docker 内 / 服务器部署通用）
#   /           → Vue3 构建产物（SPA history 路由 fallback）
#   /api        → 反代后端 backend:8080（服务器部署改为 127.0.0.1:8080）
#   /swagger-ui、/v3/api-docs → 反代后端接口文档
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 反向代理 → Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口文档 → SpringDoc
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
