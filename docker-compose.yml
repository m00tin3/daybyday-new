# ============================================================
# Day-BY-Day 一键部署编排（MySQL 8 + Redis 7 + 后端 + 前端 nginx）
#
# 生产部署步骤：
#   1) cp .env.example .env   ← 修改其中所有密码
#   2) docker compose up -d --build
#   3) 访问 http://<服务器IP>   （备用入口 http://<服务器IP>:8090）
#
# 安全约定（公网服务器务必遵守）：
#   - MySQL 3306 / Redis 6379 / 后端 8080 一律只绑定 127.0.0.1，不对外网暴露
#   - 只由前端 nginx（80 / 8090）对外提供服务
#   - 密码全部从 .env 注入，未设置则启动即失败（不做默认弱密码兜底）
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: dbd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # —— 小内存实例调优（本机 1.7G RAM）——
      # performance_schema 是 MySQL 8 的内存大户，演示环境关闭可省 200-400M
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --table-open-cache=64
      - --innodb-log-buffer-size=8M
    volumes:
      # 首次启动自动执行 init.sql（建库建表 + 演示数据）
      - mysql-data:/var/lib/mysql
      - ./dbd-server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 仅回环绑定：外网无法直连数据库，需要排查时用 SSH 隧道
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      # 走 TCP 探测：官方镜像初始化阶段以 --skip-networking 启动，
      # 因此只有 init.sql 执行完毕、对外可连接时才会返回健康
      # 密码在 compose 解析期直接代入，避免 $$ 转义歧义
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p'${MYSQL_PASSWORD}' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dbd-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # --requirepass：禁止无密码访问
    # --appendonly ：开启 AOF 持久化。秒杀库存、一人一单标记、签到 BitMap、
    #               Feed 时间线无法从 DB 完整重建，重启丢失会导致重复抢购
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      # 带密码真实探测，确保后端启动时 Redis 已可鉴权访问
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./dbd-server
    container_name: dbd-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      TZ: Asia/Shanghai
      # —— 限制 JVM 内存占用（本机 1.7G RAM）——
      # 不限制时 JVM 默认堆为物理内存 1/4，叠加 MySQL 易触发 OOM Killer
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xss512k -XX:MaxMetaspaceSize=160m"
      # 生产开关：由 .env 控制，无需改动代码
      SQL_LOG_IMPL: ${SQL_LOG_IMPL:-org.apache.ibatis.logging.nologging.NoLoggingImpl}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMS_MOCK: ${SMS_MOCK:-true}
      # 管理员免验证码登录：true 时任何知道管理员账号标识的人都能进管理后台，
      # 公开部署建议在 .env 中设为 false
      ADMIN_FREE_LOGIN: ${ADMIN_FREE_LOGIN:-true}
    ports:
      # 仅回环：Swagger 调试走 SSH 隧道，不对公网开放
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./dbd-web
    container_name: dbd-web
    ports:
      # 80 为主入口；8090 为备用入口
      # （部分国内机房对未备案域名/80 端口有拦截策略，保留双入口保证可达）
      - "${WEB_PORT:-80}:80"
      - "${WEB_PORT_ALT:-8090}:8090"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
